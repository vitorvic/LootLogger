name: Release

# Every push to main builds and tests. The new version is published only after Vitor approves
# the "publicar" environment on GitHub (the run waits at "Review deployments").
# The installed app finds it on GitHub and updates itself.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test -c Release

  release:
    needs: test
    runs-on: windows-latest
    # Required reviewer: Vitor. Only this job can write to the repository (to create the release).
    environment: publicar
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      # 1.0.1 is run 15; each later run is the next 1.0.x.
      - name: Version
        shell: pwsh
        run: echo "VERSION=1.0.$(${{ github.run_number }} - 14)" >> $env:GITHUB_ENV

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # The release is named "LootLogger 1.0.N: <summary>", the summary being the last commit's
      # message, so the release list says what each version changed.
      - name: Summary
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          echo "SUMMARY=$(git log -1 --format=%s)" >> $env:GITHUB_ENV

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Publish
        run: dotnet publish src/LootLogger.App -c Release -r win-x64 --self-contained -o publish -p:Version=${{ env.VERSION }}

      - name: Install vpk
        run: dotnet tool install -g vpk --version 1.2.161

      - name: Fetch the previous release (for small updates)
        continue-on-error: true
        run: vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }}

      - name: Pack installer
        run: vpk pack --packId LootLogger --packVersion ${{ env.VERSION }} --packDir publish --mainExe LootLogger.exe --packTitle LootLogger --packAuthors Vitor --icon src/LootLogger.App/Assets/icon.ico

      - name: Upload release
        run: >-
          vpk upload github --repoUrl https://github.com/${{ github.repository }} --publish --releaseName "LootLogger $($env:VERSION): $($env:SUMMARY)" --tag v${{ env.VERSION }} --token ${{ secrets.GITHUB_TOKEN }}
